server:
  port: 8878

spring:
  application:
    name: review-service
  datasource:
    url: ${REVIEW_DB_URL:jdbc:postgresql://localhost:5433/review_db}
    username: ${DB_USERNAME:revbook}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

revbook:
  jwt:
    secret: ${JWT_SECRET}
  google-books:
    api-key: ${GOOGLE_BOOKS}
