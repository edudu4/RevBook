services:
  postgres:
    image: postgres:16-alpine
    container_name: revbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revbook
      POSTGRES_PASSWORD: revbook
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - revbook-postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  revbook-postgres-data:
