# Deploy de produção — todos os serviços num único host (EC2), puxando as imagens
# já publicadas pelo GitHub Actions no GHCR. Preencha um .env ao lado deste arquivo
# com os valores reais (ver .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-revbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-revbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/revbook-auth-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-revbook}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  review-service:
    image: ghcr.io/${GHCR_OWNER}/revbook-review-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEW_DB_URL: jdbc:postgresql://postgres:5432/review_db
      DB_USERNAME: ${DB_USERNAME:-revbook}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_BOOKS: ${GOOGLE_BOOKS}

  gateway:
    image: ghcr.io/${GHCR_OWNER}/revbook-gateway:latest
    restart: unless-stopped
    depends_on:
      - auth-service
      - review-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8877
      REVIEW_SERVICE_URL: http://review-service:8878
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"

  frontend:
    image: ghcr.io/${GHCR_OWNER}/revbook-frontend:latest
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "3000:3000"

volumes:
  postgres-data:
