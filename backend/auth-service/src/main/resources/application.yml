server:
  port: 8877

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:revbook}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

revbook:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cookie:
    # Vazio (host-only) em dev local; ".revbook.com.br" em produção, para o cookie valer
    # tanto em revbook.com.br quanto em api.revbook.com.br.
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:false}
