server:
  port: 8878

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5433/review_db
    username: ${DB_USERNAME:revbook}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

revbook:
  jwt:
    secret: ${JWT_SECRET}
  google-books:
    # Opcional — sem chave a Google Books API funciona com uma cota bem menor por IP.
    # Gere uma em https://console.cloud.google.com/apis/credentials habilitando a "Books API".
    api-key: ${GOOGLE_BOOKS}
