services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-revbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-revbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/revbook-auth-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: ${DB_USERNAME:-revbook}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      COOKIE_DOMAIN: .revbook.com.br
      COOKIE_SECURE: "true"
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-15}
      REFRESH_EXPIRATION_DAYS: ${REFRESH_EXPIRATION_DAYS:-30}

  review-service:
    image: ghcr.io/${GHCR_OWNER}/revbook-review-service:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVIEW_DB_URL: jdbc:postgresql://postgres:5432/review_db
      DB_USERNAME: ${DB_USERNAME:-revbook}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_BOOKS: ${GOOGLE_BOOKS}
      MODERATOR_EMAIL: ${MODERATOR_EMAIL}

  gateway:
    image: ghcr.io/${GHCR_OWNER}/revbook-gateway:latest
    restart: unless-stopped
    depends_on:
      - auth-service
      - review-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8877
      REVIEW_SERVICE_URL: http://review-service:8878
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    image: ghcr.io/${GHCR_OWNER}/revbook-frontend:latest
    restart: unless-stopped
    depends_on:
      - gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - ./caddy-logs:/var/log/caddy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
