server:
  port: 3001

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8877}
          predicates:
            - Path=/auth/**
        - id: review-service-reviews
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/reviews/**
        - id: review-service-genres
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/genres
        - id: review-service-comments
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/comments/**
        - id: review-service-reactions
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/reactions/**
        - id: review-service-users
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/users/**
        - id: review-service-books
          uri: ${REVIEW_SERVICE_URL:http://localhost:8878}
          predicates:
            - Path=/books/**
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

revbook:
  jwt:
    # Chave HMAC compartilhada com auth-service e review-service (mesma variável JWT_SECRET nos 3 serviços).
    secret: ${JWT_SECRET}
